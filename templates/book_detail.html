<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ book.Cim }}</title>
</head>
<body>
    <h1>{{ book.Cim }}</h1>
    <p><strong>Author:</strong> {{ book.Iro }}</p>
    <p><strong>Publisher:</strong> {{ book.Kiado }}</p>
    <p><strong>Subject:</strong> {{ book.Tema }}</p>
    <p><strong>ISBN:</strong> {{ book.ISBN }}</p>
    <p><strong>Publication Year:</strong> {{ book.KiadasEve }}</p>
    <p><strong>Language:</strong> {{ book.Nyelv }}</p>
    <a href="{{ url_for('get_books') }}">Back to Book List</a>
</body>
</html>
