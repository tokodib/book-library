<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Library</title>
</head>
<body>
    <h1>Book Library</h1>

    <br>

    <a href="{{ url_for('add_book') }}">Add New Book</a>

    <br><br>

    <form method="get" action="{{ url_for('get_books') }}">
        <input
            type="text"
            name="search"
            placeholder="Search by title"
            value="{{ request.args.get('search', '') }}"
        >
        <button type="submit">Search</button>
    </form>

    <br>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Author</th>
                <th>Publisher</th>
                <th>Subject</th>
                <th>Title</th>
                <th>ISBN</th>
            </tr>
        </thead>

        <tbody>
            {% if books %}

                {% for book in books %}
                <tr>
                    <td>{{ book.ID }}</td>
                    <td>{{ book.Iro }}</td>
                    <td>{{ book.Kiado }}</td>
                    <td>{{ book.Tema }}</td>

                    <td>
                        <a href="{{ url_for('book_detail', book_id=book.ID) }}">
                            {{ book.Cim }}
                        </a>
                    </td>

                    <td>{{ book.ISBN }}</td>
                </tr>
                {% endfor %}

            {% else %}

                <tr>
                    <td colspan="6">No books found.</td>
                </tr>

            {% endif %}
        </tbody>
    </table>
</body>
</html>
