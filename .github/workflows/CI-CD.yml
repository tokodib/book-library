name: CI/CD

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    test:
        runs-on: ubuntu-latest
     
        services:
            mariadb:
                image: mariadb:11
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: konyvek_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mariadb-admin ping -h localhost -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Run tests
              env:
                DB_USER: root
                DB_PASSWORD: root
                DB_HOST: 127.0.0.1
                DB_PORT: 3306
                DB_NAME: konyvek_test
              run: pytest -v

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build docker image
              run: docker build -t ghcr.io/tokodib/book-library:latest .

            - name: Push docker image
              run: docker push ghcr.io/tokodib/book-library:latest

            - name: Set up WireGuard
              env:
                WG_PRIVATE_KEY: ${{ secrets.WG_PRIVATE_KEY }}
              run: |
                sudo apt-get update
                sudo apt-get install -y wireguard

                sudo sh -c "cat > /etc/wireguard/github-test.conf <<EOF
                [Interface]
                PrivateKey = ${WG_PRIVATE_KEY}
                Address = 10.10.10.2/24
                MTU = 1360

                [Peer]
                PublicKey = nn5AjGChtMvdNbJsFV3xgiRK7w+ohCm6Vgl7im0qA3g=
                AllowedIPs = 10.10.10.0/24, 192.168.1.201/32
                Endpoint = 46.40.41.66:51820
                PersistentKeepalive = 25
                EOF"

                sudo chmod 600 /etc/wireguard/github-test.conf
                sudo wg-quick up github-test

            - name: Test WireGuard connection
              run: |
                ping -c 4 10.10.10.1
                ping -c 4 192.168.1.201

            - name: Test SSH port
              run: |
                nc -vz -w 10 192.168.1.201 22                
            - name: Test SSH connection
              env:
                SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}  
              run: |
                mkdir -p ~/.ssh
                echo "192.168.1.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ53eX5tlOgXHg0eWC2V9C9gGfemkyFVoliutkJ+Z6yg" > ~/.ssh/known_hosts
                
                echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
                chmod 600 ~/.ssh/deploy_key

                ssh -vv \
                    -i ~/.ssh/deploy_key \
                    -o ConnectTimeout=10 \
                    axion@192.168.1.201 \
                    "hostname && whoami"

            - name: Check Docker Compose
              run: |
                ssh -i ~/.ssh/deploy_key \
                    axion@192.168.1.201 \
                    "cd ~/docker/book-library && docker compose ps"
            
            - name: Deploy application
              run: |
                ssh -i ~/.ssh/deploy_key \
                    -o ConnectTimeout=10 \
                    axion@192.168.1.201 \
                    "cd ~/docker/book-library && \
                    docker compose pull && \
                    docker compose up -d && \
                    docker compose ps && \
                    echo DEPLOY_OK"