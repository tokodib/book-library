<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ book.Cim }}</title>
</head>
<body>
    <h1>{{ book.Cim }}</h1>
    <p><strong>Author:</strong> {{ book.Iro }}</p>
    <p><strong>Publisher:</strong> {{ book.Kiado }}</p>
    <p><strong>Subject:</strong> {{ book.Tema }}</p>
    <p><strong>ISBN:</strong> {{ book.ISBN }}</p>
    <p><strong>Publication Year:</strong> {{ book.KiadasEve }}</p>
    <p><strong>Language:</strong> {{ book.Nyelv }}</p>
    <br>
    <a href="{{ url_for('edit_book', book_id=book.ID) }}">Edit
    <br><br>

        <form 
            action="{{ url_for('delete_book', book_id=book.ID) }}" 
            method="post" 
            onsubmit="return confirm('Are you sure you want to delete this book?');">
            <button type="submit">Delete book</button>
        </form>
        <p>
            <a href="{{ url_for('get_books') }}">Back to Book List</a>
        </p>
</body>
</html>
