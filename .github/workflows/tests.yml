name: Tests

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

permissions:
    contents: read
    packages: write

jobs:
    test:
        runs-on: ubuntu-latest
     
        services:
            mariadb:
                image: mariadb:11
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: konyvek_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mariadb-admin ping -h localhost -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Run tests
              env:
                DB_USER: root
                DB_PASSWORD: root
                DB_HOST: 127.0.0.1
                DB_PORT: 3306
                DB_NAME: konyvek_test
              run: pytest -v

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build docker image
              run: docker build -t ghcr.io/tokodib/book-library:latest .

            - name: Push docker image
              run: docker push ghcr.io/tokodib/book-library:latest