<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
</head>
<body>
    <h1>Add New Book</h1>
    <form method="POST">
        <label for="Iro">Author:</label>
        <input type="text" id="Iro" name="Iro" required><br><br>

        <label for="Kiado">Publisher:</label>
        <input type="text" id="Kiado" name="Kiado"><br><br>

        <label for="Tema">Theme:</label>
        <input type="text" id="Tema" name="Tema" required><br><br>

        <label for="Cim">Title:</label>
        <input type="text" id="Cim" name="Cim" required><br><br>

        <label for="ISBN">ISBN:</label>
        <input type="text" id="ISBN" name="ISBN"><br><br>

        <label for="KiadasEve">Publication Year:</label>
        <input type="number" id="KiadasEve" name="KiadasEve"><br><br>

        <label for="Nyelv">Language:</label>
        <input type="text" id="Nyelv" name="Nyelv"><br><br>

        <button type "submit">Add Book</button>
    </form>
    <br>
    <a href="{{ url_for('get_books') }}">Back to Books</a>
</body>
</html>
